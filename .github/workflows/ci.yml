name: CI

# "Is this code good enough to merge?"
#
# WHEN does this run?
#  - pull_request : when a PR is opened, and again on EVERY commit pushed to that PR's branch.
#                   GitHub shows the result on the PR, and branch protection can block merging until it's green.
#  - workflow_call: release.yml reuses this whole file before shipping (write once, use twice).
#  - workflow_dispatch: the "Run workflow" button in the Actions tab.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# If you push 3 commits quickly to a PR, cancel the older runs - only the newest commit matters.
# (Never cancel on main: those runs are releasing.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read   # least privilege: CI only needs to read the code

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22'

jobs:
  # The three jobs below have no "needs:", so they run at the same time on 3 separate VMs.

  test-api:
    name: Test .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # download the repo onto the VM
      - uses: actions/setup-dotnet@v4      # install .NET
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test HelloCicd.sln --configuration Release

  build-web:
    name: Lint + build React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm                       # reuse downloaded packages between runs (faster)
          cache-dependency-path: web/package-lock.json
      - run: npm ci                        # like npm install, but exact versions from the lock file
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Docker image builds (${{ matrix.app }})
    runs-on: ubuntu-latest
    # A matrix runs this job once per value: one job for api, one for web.
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build the image but DON'T push it. This proves the Dockerfile still works,
      # so a broken Dockerfile is caught in the PR, not after merge.
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
