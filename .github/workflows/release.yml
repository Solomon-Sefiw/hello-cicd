name: Release

# "Ship it." Runs when code lands on main (a merged PR, or a direct push).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one release at a time. A newer push waits for the current one instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22'

jobs:
  # Step 1: run the exact same checks as on the PR (reusable workflow).
  ci:
    uses: ./.github/workflows/ci.yml

  # Step 2a: build Docker images and publish them to GitHub Container Registry (ghcr.io). Free, no setup.
  publish-images:
    name: Publish image (${{ matrix.app }})
    needs: ci                      # only if every CI check passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # allows GITHUB_TOKEN to push to ghcr.io
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is created automatically for every run - no secret to set up.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image name and tags. Every image gets two tags:
      #   sha-1a2b3c4 : exactly this commit (never changes - use this to deploy or roll back)
      #   latest      : whatever main is right now
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Step 2b: deploy to AWS (runs in parallel with publish-images).
  # Skipped until you set the LAMBDA_FUNCTION_NAME variable, so the pipeline stays green before AWS exists.
  deploy-aws:
    name: Deploy to AWS
    needs: ci
    if: vars.LAMBDA_FUNCTION_NAME != ''
    runs-on: ubuntu-latest
    environment: production        # shows under "Environments"; you can add a manual approval here later
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Logs the runner into your AWS account using the secrets you saved in GitHub.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # --- Backend: .NET -> AWS Lambda ---
      - name: Publish API
        run: |
          dotnet publish api/Api.csproj -c Release -r linux-x64 --self-contained false -o publish
          cd publish && zip -qr ../api.zip .

      - name: Upload API to Lambda
        run: |
          aws lambda update-function-code --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --zip-file fileb://api.zip > /dev/null
          aws lambda wait function-updated --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
          aws lambda update-function-configuration --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --environment "Variables={APP_VERSION=${GITHUB_SHA::7},AllowedOrigin=${{ vars.WEB_URL || '*' }}}" > /dev/null
          aws lambda wait function-updated --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Find the API's public URL
        id: api
        run: echo "url=$(aws lambda get-function-url-config --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --query FunctionUrl --output text)" >> "$GITHUB_OUTPUT"

      # --- Frontend: React -> S3 static website ---
      - name: Build React app pointing at the live API
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: |
          npm ci
          npm run build

      - name: Upload React app to S3
        run: aws s3 sync web/dist "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Smoke test
        run: curl --fail --silent "${{ steps.api.outputs.url }}api/health"

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.api.outputs.url }}api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${{ vars.WEB_URL }}" >> "$GITHUB_STEP_SUMMARY"
